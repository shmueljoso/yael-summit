<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#05070E;color:#F4F1EA;font-family:system-ui,sans-serif}
  main{min-height:100%;display:grid;place-items:center;text-align:center;padding:32px;box-sizing:border-box}
  h1{font-family:Georgia,serif;font-size:2rem;margin:0 0 10px;letter-spacing:-.02em}
  p{color:#A2A8BA;margin:0 0 24px;line-height:1.5}
  button{font:600 1rem system-ui,sans-serif;border:0;border-radius:999px;padding:14px 26px;background:#E3B55A;color:#1A1306}
  .dot{width:10px;height:10px;border-radius:50%;background:#E3B55A;box-shadow:0 0 16px #E3B55A;margin:0 auto 22px}
</style></head>
<body><main><div><div class="dot"></div><h1>No connection</h1><p>The constellation will be back as soon as you're online.</p>
<button onclick="Android.retry()">Try again</button></div></main></body></html>
